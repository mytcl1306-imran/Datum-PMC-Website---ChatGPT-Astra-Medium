<VirtualHost *:80>
 DocumentRoot /var/www/html/public
 <Directory /var/www/html/public>
  AllowOverride None
  Require all granted
  Options -Indexes
  RewriteEngine On
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteRule ^ index.php [QSA,L]
 </Directory>
 ErrorLog /proc/self/fd/2
 CustomLog /proc/self/fd/1 combined
</VirtualHost>
